[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svg-sheriff"
version = "0.1.0"
description = "A local SVG accessibility, motion and safety auditor"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MofidChallenge10"}]
keywords = ["svg", "accessibility", "security", "animation", "cli"]

[project.scripts]
svg-sheriff = "svg_sheriff:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["svg_sheriff"]
